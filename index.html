<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Mail Tracking | Minimal & Modern</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 class="brand-title">
                <span style="display:inline-block; width:10px; height:10px; background:var(--accent-teal); border-radius:50%;"></span>
                E-Mail Tracker
            </h1>
            <div class="brand-subtitle">Erfassung & Analyse · Vertrieb, Einkauf, Rechnungen</div>
        </div>
        <div class="header-actions">
            <!-- Versteckter File-Input für Import -->
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
            
            <button class="icon-btn" onclick="document.getElementById('import-file').click()">📂 Import</button>
            <button class="icon-btn" onclick="exportData()">💾 Upload</button>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('datenerfassung')">Datenerfassung</button>
        <button class="tab-btn" onclick="switchTab('diagramme')">Diagramme & Analyse</button>
    </div>

    <!-- TAB 1: DATENERFASSUNG -->
    <div id="datenerfassung" class="tab-content active">
        <div class="card">
            <div class="filter-bar">
                <div class="control-group">
                    <label>Jahr</label>
                    <select id="select-year" onchange="loadTableData()"></select>
                </div>
                <div class="control-group">
                    <label>Kalenderwoche</label>
                    <select id="select-kw" onchange="loadTableData()"></select>
                </div>
                <div class="control-group">
                    <label>Wochentag</label>
                    <select id="select-day" onchange="loadTableData()">
                        <option value="Montag">Montag</option>
                        <option value="Dienstag">Dienstag</option>
                        <option value="Mittwoch">Mittwoch</option>
                        <option value="Donnerstag">Donnerstag</option>
                        <option value="Freitag">Freitag</option>
                        <option value="Samstag">Samstag (Manuell)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="saveCurrentDayData()">Tag Speichern</button>
            </div>

            <div class="table-responsive">
                <table class="tracking-table">
                    <thead>
                        <tr>
                            <th>Uhrzeit</th>
                            <th>Vertrieb & Aftersales</th>
                            <th>Einkauf</th>
                            <th>Rechnungen</th>
                        </tr>
                    </thead>
                    <tbody id="hourly-rows"></tbody>
                    <tfoot>
                        <tr class="table-totals">
                            <td>Tagessumme</td>
                            <td id="sum-vertrieb">0</td>
                            <td id="sum-einkauf">0</td>
                            <td id="sum-rechnungen">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB 2: DIAGRAMME & AUSWERTUNG -->
    <div id="diagramme" class="tab-content">
        <div class="card">
            <div class="filter-bar">
                <div class="control-group">
                    <label>Auswertungsjahr</label>
                    <select id="chart-year" onchange="updateCharts()"></select>
                </div>
                <div class="control-group">
                    <label>Auswertungs-KW</label>
                    <select id="chart-kw" onchange="updateCharts()"></select>
                </div>
            </div>

            <div class="kpi-grid">
                <div class="kpi-card">
                    <p class="kpi-title">Mails in dieser KW</p>
                    <p class="kpi-value" id="kpi-kw-total">0</p>
                </div>
                <div class="kpi-card">
                    <p class="kpi-title">Stärkste Abteilung</p>
                    <p class="kpi-value" id="kpi-top-dept">-</p>
                </div>
                <div class="kpi-card">
                    <p class="kpi-title">Spitzen-Uhrzeit</p>
                    <p class="kpi-value" id="kpi-top-hour">-</p>
                </div>
            </div>

            <div class="charts-grid">
                <div class="card" style="margin-bottom:0;">
                    <h3 style="font-size:15px; margin-top:0; color:var(--text-main);">Anzahl nach Abteilung (KW)</h3>
                    <canvas id="deptChart"></canvas>
                </div>
                <div class="card" style="margin-bottom:0;">
                    <h3 style="font-size:15px; margin-top:0; color:var(--text-main);">Tagesverlauf nach Abteilung</h3>
                    <canvas id="hourlyTrendChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const hours = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00"];
    let store = JSON.parse(localStorage.getItem('email_tracking_db')) || {};

    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        document.getElementById('theme-btn').innerText = newTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        
        if (document.getElementById('diagramme').classList.contains('active')) {
            updateCharts();
        }
    }

    (function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        setTimeout(() => {
            document.getElementById('theme-btn').innerText = savedTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        }, 100);
    })();

    function initSelectors() {
        const yearSelect = document.getElementById('select-year');
        const chartYearSelect = document.getElementById('chart-year');
        const currentYear = new Date().getFullYear();
        
        for (let y = currentYear - 2; y <= currentYear + 5; y++) {
            yearSelect.add(new Option(y, y));
            chartYearSelect.add(new Option(y, y));
        }
        yearSelect.value = currentYear;
        chartYearSelect.value = currentYear;

        const kwSelect = document.getElementById('select-kw');
        const chartKwSelect = document.getElementById('chart-kw');
        for (let kw = 1; kw <= 52; kw++) {
            kwSelect.add(new Option('KW ' + kw, kw));
            chartKwSelect.add(new Option('KW ' + kw, kw));
        }
        kwSelect.value = 14;
        chartKwSelect.value = 14;
    }

    function renderTable() {
        const tbody = document.getElementById('hourly-rows');
        tbody.innerHTML = '';

        hours.forEach((h, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${h} Uhr</td>
                <td><input type="number" min="0" id="v_${index}" value="0" onchange="calculateSums()"></td>
                <td><input type="number" min="0" id="e_${index}" value="0" onchange="calculateSums()"></td>
                <td><input type="number" min="0" id="r_${index}" value="0" onchange="calculateSums()"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function getKey() {
        const y = document.getElementById('select-year').value;
        const kw = document.getElementById('select-kw').value;
        const day = document.getElementById('select-day').value;
        return `${y}_KW${kw}_${day}`;
    }

    function saveCurrentDayData() {
        const key = getKey();
        const dayData = hours.map((h, i) => ({
            hour: h,
            vertrieb: parseInt(document.getElementById(`v_${i}`).value) || 0,
            einkauf: parseInt(document.getElementById(`e_${i}`).value) || 0,
            rechnungen: parseInt(document.getElementById(`r_${i}`).value) || 0,
        }));

        store[key] = dayData;
        localStorage.setItem('email_tracking_db', JSON.stringify(store));
        
        const btn = document.querySelector('.btn-primary');
        const originalText = btn.innerText;
        btn.innerText = "✓ Gespeichert";
        btn.style.background = "#2e7d32";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "var(--accent-teal)";
        }, 1800);
    }

    function loadTableData() {
        const key = getKey();
        const data = store[key] || [];

        hours.forEach((h, i) => {
            const rowData = data[i] || { vertrieb: 0, einkauf: 0, rechnungen: 0 };
            document.getElementById(`v_${i}`).value = rowData.vertrieb;
            document.getElementById(`e_${i}`).value = rowData.einkauf;
            document.getElementById(`r_${i}`).value = rowData.rechnungen;
        });
        calculateSums();
    }

    function calculateSums() {
        let sumV = 0, sumE = 0, sumR = 0;

        hours.forEach((h, i) => {
            sumV += parseInt(document.getElementById(`v_${i}`).value) || 0;
            sumE += parseInt(document.getElementById(`e_${i}`).value) || 0;
            sumR += parseInt(document.getElementById(`r_${i}`).value) || 0;
        });

        document.getElementById('sum-vertrieb').innerText = sumV;
        document.getElementById('sum-einkauf').innerText = sumE;
        document.getElementById('sum-rechnungen').innerText = sumR;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');

        if(tabId === 'diagramme') {
            updateCharts();
        }
    }

    let deptChart, hourlyTrendChart;

    function updateCharts() {
        const year = document.getElementById('chart-year').value;
        const kw = document.getElementById('chart-kw').value;
        const days = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

        let totalV = 0, totalE = 0, totalR = 0;
        let hourlyV = new Array(hours.length).fill(0);
        let hourlyE = new Array(hours.length).fill(0);
        let hourlyR = new Array(hours.length).fill(0);
        let hourlyTotal = new Array(hours.length).fill(0);

        days.forEach(day => {
            const key = `${year}_KW${kw}_${day}`;
            const data = store[key] || [];
            data.forEach((row, i) => {
                const v = row.vertrieb || 0;
                const e = row.einkauf || 0;
                const r = row.rechnungen || 0;

                totalV += v;
                totalE += e;
                totalR += r;

                hourlyV[i] += v;
                hourlyE[i] += e;
                hourlyR[i] += r;
                hourlyTotal[i] += (v + e + r);
            });
        });

        const totalKW = totalV + totalE + totalR;
        document.getElementById('kpi-kw-total').innerText = totalKW;

        let topDept = "Vertrieb & Aftersales";
        if (totalE > totalV && totalE > totalR) topDept = "Einkauf";
        if (totalR > totalV && totalR > totalE) topDept = "Rechnungen";
        document.getElementById('kpi-top-dept').innerText = totalKW > 0 ? topDept : "-";

        const maxHourIdx = hourlyTotal.indexOf(Math.max(...hourlyTotal));
        document.getElementById('kpi-top-hour').innerText = totalKW > 0 ? hours[maxHourIdx] + " Uhr" : "-";

        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const textColor = isDark ? '#f0f1f5' : '#2d2f36';
        const gridColor = isDark ? '#2c303c' : '#e3dfd7';

        if (deptChart) deptChart.destroy();
        const ctx1 = document.getElementById('deptChart').getContext('2d');
        deptChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['Vertrieb & Aftersales', 'Einkauf', 'Rechnungen'],
                datasets: [{
                    label: 'Anzahl Mails',
                    data: [totalV, totalE, totalR],
                    backgroundColor: ['#1d1f3e', '#1aabbb', '#e07a5f'],
                    borderRadius: 8
                }]
            },
            options: { 
                responsive: true, 
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: textColor }, grid: { display: false } },
                    y: { ticks: { color: textColor }, grid: { color: gridColor } }
                }
            }
        });

        if (hourlyTrendChart) hourlyTrendChart.destroy();
        const ctx2 = document.getElementById('hourlyTrendChart').getContext('2d');
        hourlyTrendChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: hours,
                datasets: [
                    {
                        label: 'Vertrieb & Aftersales',
                        data: hourlyV,
                        borderColor: '#1d1f3e',
                        backgroundColor: '#1d1f3e',
                        tension: 0.3,
                        borderWidth: 2.5,
                        pointRadius: 4
                    },
                    {
                        label: 'Einkauf',
                        data: hourlyE,
                        borderColor: '#1aabbb',
                        backgroundColor: '#1aabbb',
                        tension: 0.3,
                        borderWidth: 2.5,
                        pointRadius: 4
                    },
                    {
                        label: 'Rechnungen',
                        data: hourlyR,
                        borderColor: '#e07a5f',
                        backgroundColor: '#e07a5f',
                        tension: 0.3,
                        borderWidth: 2.5,
                        pointRadius: 4
                    }
                ]
            },
            options: { 
                responsive: true,
                plugins: { 
                    legend: { 
                        display: true,
                        position: 'top',
                        labels: {
                            color: textColor,
                            font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' },
                            usePointStyle: true,
                            boxWidth: 8
                        }
                    } 
                },
                scales: {
                    x: { ticks: { color: textColor }, grid: { display: false } },
                    y: { ticks: { color: textColor }, grid: { color: gridColor } }
                }
            }
        });
    }

    // UPLOAD FUNKTION (Generiert Backup-Datei mit Datum & Uhrzeit)
    function exportData() {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10); // YYYY-MM-DD
        const timeStr = now.toTimeString().slice(0, 8).replace(/:/g, '-'); // HH-MM-SS
        const fileName = `EmailTracker_Backup_${dateStr}_${timeStr}.json`;

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // IMPORT FUNKTION (Liest ausgewählte Backup-Datei ein)
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedStore = JSON.parse(e.target.result);
                if (typeof importedStore === 'object' && importedStore !== null) {
                    store = importedStore;
                    localStorage.setItem('email_tracking_db', JSON.stringify(store));
                    loadTableData();
                    alert("✓ Daten erfolgreich importiert!");
                } else {
                    alert("⚠️ Die Datei hat ein ungültiges Format.");
                }
            } catch (err) {
                alert("⚠️ Fehler beim Lesen der Datei. Bitte wähle eine gültige JSON-Sicherungsdatei aus.");
            }
        };
        reader.readAsText(file);
    }

    initSelectors();
    renderTable();
    loadTableData();
</script>

</body>
</html>
